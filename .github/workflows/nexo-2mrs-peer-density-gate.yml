name: nexo-2mrs-peer-density-gate
on:
  push:
    branches: [nexo-desi-voidscan-temp-20260826]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy scipy pandas
      - name: Download 2MRS catalog
        run: |
          mkdir -p input density2mrs selfnorm
          curl -fL --retry 5 'https://cdsarc.cds.unistra.fr/ftp/cats/J/ApJS/199/26/table3.dat.gz' -o input/table3.dat.gz
          gunzip -c input/table3.dat.gz > input/table3.dat
          wc -l input/table3.dat
      - name: Run 2MRS absolute-density diagnostic
        run: python tools/local_density_2mrs_peer_gate.py --data input/table3.dat --out density2mrs | tee density2mrs/run.log
      - name: Run self-normalized n(z) gate
        run: python tools/local_hole_nz_selfnorm.py --data input/table3.dat --out selfnorm | tee selfnorm/run.log
      - name: Readback
        run: |
          cat density2mrs/summary.json
          cat selfnorm/summary.json
          cat selfnorm/primary_selfnorm.csv
          cat selfnorm/primary_sector_selfnorm.csv
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-2mrs-peer-density-gate
          path: |
            density2mrs/
            selfnorm/
          retention-days: 1
