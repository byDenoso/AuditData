name: Export pinned CAMB source

on:
  push:
    branches: [export-camb-source-20260730]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/export-camb-source.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify CAMB 1.6.6 source
        run: |
          mkdir -p dist
          python -m pip download 'camb==1.6.6' --no-binary=:all: --no-deps --dest dist
          echo '9856202a5c05570256e52377b20431891c7b08b2e9c334e141fd08d2a085516f  dist/camb-1.6.6.tar.gz' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: camb-1.6.6-source
          path: dist/camb-1.6.6.tar.gz
          if-no-files-found: error
          retention-days: 7
