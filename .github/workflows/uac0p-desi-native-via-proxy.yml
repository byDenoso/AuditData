name: UAC0P DESI native via verified proxy

on:
  push:
    branches: [uac0p-desi-native-20260827]
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'camb==1.6.6' 'cobaya>=3.5,<3.7' scipy numpy h5py pyyaml requests beautifulsoup4
          python -m pip install git+https://github.com/adematti/lsstypes.git
          python -m pip install git+https://github.com/cosmodesi/cosmoprimo.git
          python -m pip install velocileptors
      - name: Stage official code and likelihoods through proxy
        run: |
          git clone --depth 1 https://github.com/cosmodesi/desi-kp-cosmological-likelihoods.git desi_official
          mkdir -p fs_bao_likelihoods data/likelihood results block_results
          cp desi_official/dr1/cobaya/*.py fs_bao_likelihoods/
          cp desi_official/dr1/cobaya/*.yaml fs_bao_likelihoods/
          touch fs_bao_likelihoods/__init__.py
          python - <<'PY'
          import requests, pathlib, hashlib, json, concurrent.futures
          upstream='https://data.desi.lbl.gov/public/dr1/vac/dr1/full-shape-bao-clustering/v1.0/data/likelihood/'
          proxy='https://nexo-file-path-probe.vercel.app/api/raw'
          names=[
          'likelihood_spectrum-poles-rotated+bao-recon_syst-rotation-hod-photo_BGS_BRIGHT-21.5_GCcomb_z0.1-0.4_thetacut0.05.h5',
          'likelihood_spectrum-poles-rotated+bao-recon_syst-rotation-hod-photo_LRG_GCcomb_z0.4-0.6_thetacut0.05.h5',
          'likelihood_spectrum-poles-rotated+bao-recon_syst-rotation-hod-photo_LRG_GCcomb_z0.6-0.8_thetacut0.05.h5',
          'likelihood_spectrum-poles-rotated+bao-recon_syst-rotation-hod-photo_LRG_GCcomb_z0.8-1.1_thetacut0.05.h5',
          'likelihood_spectrum-poles-rotated+bao-recon_syst-rotation-hod-photo_ELG_LOPnotqso_GCcomb_z1.1-1.6_thetacut0.05.h5',
          'likelihood_spectrum-poles-rotated+bao-recon_syst-rotation-hod-photo_QSO_GCcomb_z0.8-2.1_thetacut0.05.h5']
          out=pathlib.Path('data/likelihood')
          def get(name):
              r=requests.get(proxy,params={'url':upstream+name},timeout=(20,180)); r.raise_for_status()
              data=r.content
              if len(data)<500000 or not data.startswith(b'\x89HDF\r\n\x1a\n'):
                  raise RuntimeError(f'Invalid HDF5 proxy payload {name}: size={len(data)}, head={data[:80]!r}, ctype={r.headers.get("content-type")}')
              p=out/name; p.write_bytes(data)
              item={'name':name,'size':len(data),'sha256':hashlib.sha256(data).hexdigest(),'content_type':r.headers.get('content-type')}
              print('VALIDATED',item,flush=True); return item
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:
              manifest=list(ex.map(get,names))
          pathlib.Path('results/DESI_DR1_NATIVE_INPUT_MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          PY
          python - <<'PY'
          import pathlib, yaml
          p=pathlib.Path('fs_bao_likelihoods/desi_fs_bao_all.yaml')
          cfg=yaml.safe_load(p.read_text())
          cfg['data_dir']=str(pathlib.Path('data/likelihood').resolve())
          p.write_text(yaml.safe_dump(cfg,sort_keys=False))
          PY
          (cd fs_bao_likelihoods && python generate_files_fs_bao.py)
          test -f fs_bao_likelihoods/desi_fs_bao_all_nolya.py
          test -f fs_bao_likelihoods/desi_fs_bao_all_nolya.yaml
      - name: Run fixed-cosmology native nuisance profile
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python uac0p_native/fit_native.py
      - name: Run tracer and FS-vs-BAO robustness battery
        run: |
          PYTHONPATH="$PWD:$PYTHONPATH" python uac0p_native/fit_blocks.py
      - name: Hash outputs
        if: always()
        run: |
          find results block_results -type f -print0 | sort -z | xargs -0 sha256sum > results/SHA256SUMS_ALL.txt || true
          cat results/SHA256SUMS_ALL.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uac0p-desi-native-via-proxy-battery
          path: |
            results/
            block_results/
          retention-days: 1
