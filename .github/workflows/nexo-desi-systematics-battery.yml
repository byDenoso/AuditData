name: nexo-desi-systematics-battery
on:
  push:
    branches: [nexo-desi-voidscan-temp-20260826]
    paths: [.github/workflows/nexo-desi-systematics-battery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planck-lensing-fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip numpy scipy astropy healpy
      - name: Download Planck lensing KLM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p planckdata planckout
          curl -fL --retry 5 'https://irsa.ipac.caltech.edu/data/Planck/release_2/all-sky-maps/maps/component-maps/lensing/COM_CompMap_Lensing_2048_R2.00.tar' -o planck.tar
          tar -xf planck.tar -C planckdata
          find planckdata -type f -maxdepth 3 -print
      - name: Planck KLM to kappa test
        run: python tools/v14_planck_lensing.py --root planckdata --out planckout | tee planckout/run.log
      - name: Readback
        run: cat planckout/planck_v14.json
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-v14-planck-lensing-fixed
          path: planckout/
          retention-days: 1
