name: nexo-desi-systematics-battery
on:
  push:
    branches: [nexo-desi-voidscan-temp-20260826]
    paths: [.github/workflows/nexo-desi-systematics-battery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v14-support-matched:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip numpy scipy astropy
      - name: Download LRG and official random
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data supportout
          B='https://data.desi.lbl.gov/public/dr1/survey/catalogs/dr1/LSS/iron/LSScats/v1.5'
          curl -fsSL --retry 5 "$B/LRG_NGC_clustering.dat.fits" -o data/LRG.fits
          curl -fsSL --retry 5 "$B/LRG_NGC_0_clustering.ran.fits" -o data/random.fits
      - name: Support-matched null
        run: python tools/v14_support_matched.py --lrg data/LRG.fits --random data/random.fits --out supportout | tee supportout/run.log
      - name: Readback
        run: cat supportout/support_matched.json
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-v14-support-matched
          path: supportout/
          retention-days: 1
