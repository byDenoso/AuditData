name: nexo-desi-systematics-battery
on:
  push:
    branches: [nexo-desi-voidscan-temp-20260826]
    paths: [.github/workflows/nexo-desi-systematics-battery.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structured:
    strategy:
      fail-fast: false
      matrix:
        tracer: [LRG, ELG]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip numpy scipy pandas astropy
      - name: Download catalogs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data structured
          B='https://data.desi.lbl.gov/public/dr1/survey/catalogs/dr1/LSS/iron/LSScats/v1.5'
          if [ '${{ matrix.tracer }}' = 'LRG' ]; then
            curl -fsSL --retry 5 "$B/LRG_NGC_clustering.dat.fits" -o data/NGC.fits
            curl -fsSL --retry 5 "$B/LRG_SGC_clustering.dat.fits" -o data/SGC.fits
          else
            curl -fsSL --retry 5 "$B/ELG_LOPnotqso_NGC_clustering.dat.fits" -o data/NGC.fits
            curl -fsSL --retry 5 "$B/ELG_LOPnotqso_SGC_clustering.dat.fits" -o data/SGC.fits
          fi
      - name: Run structured nulls
        run: |
          python tools/structured_nulls.py --tracer '${{ matrix.tracer }}' --ngc data/NGC.fits --sgc data/SGC.fits --candidates tools/falsification_candidates.csv --nrep 50 --outdir structured | tee structured/run_${{ matrix.tracer }}.log
      - name: Readback
        run: |
          cat structured/verdict_${{ matrix.tracer }}.csv
          cat structured/structured_${{ matrix.tracer }}.csv
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-structured-nulls-${{ matrix.tracer }}
          path: structured/
          if-no-files-found: error
          retention-days: 1
