name: nexo-peer-observer-h0
on:
  push:
    branches: [nexo-desi-voidscan-temp-20260826]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy scipy pandas
      - name: Download Pantheon+
        run: |
          mkdir -p input peerh0
          curl -fL --retry 5 'https://raw.githubusercontent.com/PantheonPlusSH0ES/DataRelease/main/Pantheon%2B_Data/4_DISTANCES_AND_COVAR/Pantheon%2BSH0ES.dat' -o input/pantheon.dat
      - name: Run PEER observer-location battery
        run: python tools/peer_observer_h0_tests.py --data input/pantheon.dat --out peerh0 | tee peerh0/run.log
      - name: Readback
        run: |
          cat peerh0/summary.json
          cat peerh0/peer_target_matches.csv
          head -30 peerh0/peer_observer_void_grid.csv
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-peer-observer-h0
          path: peerh0/
          retention-days: 1
