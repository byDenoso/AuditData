name: PEER n3 scalar perturbation signature

on:
  pull_request:
    branches: [main]
    paths:
      - 'peer_n3_signature/**'
      - 'tests/test_peer_n3_signature.py'
      - 'scripts/build_camb_nopert.sh'
      - '.github/workflows/peer-n3-scalar-signature.yml'
      - 'docs/superpowers/plans/2026-07-31-peer-n3-scalar-signature.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peer-n3-signature-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
  MPLBACKEND: Agg

jobs:
  signature:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install compiler and numerical libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libgsl-dev

      - name: Install pinned stock CAMB runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install \
            'numpy==2.1.3' \
            'scipy==1.14.1' \
            'matplotlib==3.9.2' \
            'pytest==8.3.5' \
            'camb==1.6.6'
          python - <<'PY'
          import camb, matplotlib, numpy, scipy
          assert camb.__version__ == '1.6.6'
          print('STOCK_RUNTIME_PASS', camb.__version__, numpy.__version__, scipy.__version__, matplotlib.__version__)
          PY

      - name: Run analysis primitive tests
        run: |
          set -euo pipefail
          pytest -q tests/test_peer_n3_signature.py
          python -m compileall -q peer_n3_signature

      - name: Generate stock scalar, effective-fluid and nuisance spectra
        run: |
          set -euo pipefail
          mkdir -p results/n3_signature/spectra
          timeout --signal=INT --kill-after=60s 110m \
            python -m peer_n3_signature.generate \
              --mode stock \
              --output results/n3_signature/spectra \
              --lmax 3000 \
            |& tee results/n3_signature/stock_generation.log

      - name: Build exact-background no-perturbation CAMB
        run: |
          set -euo pipefail
          bash scripts/build_camb_nopert.sh \
            .cache/camb-1.6.6-nopert \
            .venv-nopert \
            results/n3_signature/spectra/camb_nopert_provenance.json \
            |& tee results/n3_signature/nopert_build.log

      - name: Generate exact-background no-perturbation spectrum
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=60s 30m \
            .venv-nopert/bin/python -m peer_n3_signature.generate \
              --mode nopert \
              --output results/n3_signature/spectra \
              --lmax 3000 \
            |& tee results/n3_signature/nopert_generation.log

      - name: Extract nuisance-projected n3 fingerprint
        run: |
          set -euo pipefail
          python -m peer_n3_signature.analyze \
            --input results/n3_signature/spectra \
            --output results/n3_signature/fingerprint \
            |& tee results/n3_signature/analysis.log

      - name: Validate scientific evidence contract
        env:
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          root = Path('results/n3_signature')
          spectra = root / 'spectra'
          fingerprint = root / 'fingerprint'
          required = [
              fingerprint / 'signature_metrics.json',
              fingerprint / 'signature_spectra.csv',
              fingerprint / 'REPORT.md',
              fingerprint / 'exact_scalar_signature.png',
              fingerprint / 'projected_signature.png',
              fingerprint / 'band_ranking.png',
              spectra / 'camb_nopert_provenance.json',
              spectra / 'generation_contract.json',
              spectra / 'nopert_contract.json',
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          assert not missing, missing
          npz = sorted(spectra.glob('*.npz'))
          assert len(npz) == 20, f'expected 20 spectra, found {len(npz)}'
          result = json.loads((fingerprint / 'signature_metrics.json').read_text(encoding='utf-8'))
          assert result['test_id'] == 'T-N3-003'
          assert result['evidence_class'] == 'EXACT_BACKGROUND_CAMB_PERTURBATION_ABLATION'
          assert result['status'] in {
              'DISTINCT_N3_SCALAR_PERTURBATION_FINGERPRINT',
              'SCALAR_PERTURBATION_RESPONSE_NOT_N3_SPECIFIC',
              'NO_DISTINCT_N3_SCALAR_PERTURBATION_FINGERPRINT',
          }
          for key, value in result['background_equality'].items():
              assert math.isfinite(float(value)), (key, value)
              assert float(value) <= 2e-9, (key, value)
          assert math.isfinite(float(result['projected_cv_norm_ell30_3000']))
          assert 0 <= float(result['survival_fraction']) <= 1.000001
          assert 'not Planck, ACT or SPT likelihood significances' in result['claim_boundary']
          report = (fingerprint / 'REPORT.md').read_text(encoding='utf-8')
          assert 'not an observed detection' in report

          manifest = {
              'test_id': 'T-N3-003',
              'objective': 'Find a CMB signature of linear perturbations in the canonical PEER scalar n=3 model.',
              'model': 'CAMB 1.6.6 EarlyQuintessence n=3 exact-background perturbation ablation',
              'canonical_slice': {
                  'n': 3.0,
                  'fde_zc': 0.0880,
                  'log10_zc': 3.81,
                  'theta_i': 2.89155,
                  'H0': 70.795,
              },
              'commit': os.environ['COMMIT_SHA'],
              'workflow_run_id': os.environ['WORKFLOW_RUN_ID'],
              'workflow_run_attempt': os.environ['WORKFLOW_RUN_ATTEMPT'],
              'state': 'COMPLETED_AND_CONTRACT_VALIDATED',
              'result_status': result['status'],
              'claim_boundary': result['claim_boundary'],
          }
          (root / 'RUN_MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')
          hashes = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'ALL_FILES.sha256':
                  hashes.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}")
          (root / 'ALL_FILES.sha256').write_text('\n'.join(hashes) + '\n', encoding='utf-8')
          print('VALIDATED_N3_SIGNATURE=' + json.dumps({
              'status': result['status'],
              'projected_cv_norm': result['projected_cv_norm_ell30_3000'],
              'survival_fraction': result['survival_fraction'],
              'best_band': result['best_band']['name'],
              'n_cosine': result['cosine_with_local_n_derivative'],
          }, sort_keys=True))
          print('COMPLETION_CONTRACT_PASS')
          PY

      - name: Upload complete n3 signature package
        uses: actions/upload-artifact@v4
        with:
          name: peer-n3-scalar-signature-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/n3_signature
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
