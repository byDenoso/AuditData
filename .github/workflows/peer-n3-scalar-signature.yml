name: PEER n3 physical local fingerprint

on:
  pull_request:
    branches: [main]
    paths:
      - 'peer_n3_signature/**'
      - 'tests/test_peer_n3_signature.py'
      - '.github/workflows/peer-n3-scalar-signature.yml'
      - 'docs/superpowers/plans/2026-07-31-peer-n3-scalar-signature.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peer-n3-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: ${{ github.workspace }}
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
  MPLBACKEND: Agg

jobs:
  fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned CAMB runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install \
            'numpy==2.1.3' \
            'scipy==1.14.1' \
            'matplotlib==3.9.2' \
            'pytest==8.3.5' \
            'camb==1.6.6'
          python - <<'PY'
          import camb, matplotlib, numpy, scipy
          assert camb.__version__ == '1.6.6'
          print('RUNTIME_PASS', camb.__version__, numpy.__version__, scipy.__version__, matplotlib.__version__)
          PY

      - name: Run analysis tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_peer_n3_signature.py
          python -m compileall -q peer_n3_signature

      - name: Generate physical scalar family and nuisance spectra
        run: |
          set -euo pipefail
          mkdir -p results/n3_local/spectra
          timeout --signal=INT --kill-after=60s 110m \
            python -m peer_n3_signature.generate \
              --mode stock \
              --output results/n3_local/spectra \
              --lmax 3000 \
            |& tee results/n3_local/generation.log

      - name: Extract physical local n3 fingerprint
        run: |
          set -euo pipefail
          python -m peer_n3_signature.analyze_local_n \
            --input results/n3_local/spectra \
            --output results/n3_local/fingerprint \
            |& tee results/n3_local/analysis.log

      - name: Validate evidence contract
        env:
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path

          root = Path('results/n3_local')
          spectra = root / 'spectra'
          fingerprint = root / 'fingerprint'
          required = [
              fingerprint / 'local_n3_metrics.json',
              fingerprint / 'local_n3_spectra.csv',
              fingerprint / 'REPORT.md',
              fingerprint / 'local_n3_projected_signature.png',
              fingerprint / 'n3_curvature_signature.png',
              fingerprint / 'local_n3_band_ranking.png',
              fingerprint / 'local_n3_lensing_signature.png',
              spectra / 'generation_contract.json',
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size == 0]
          assert not missing, missing
          assert len(list(spectra.glob('*.npz'))) == 19
          result = json.loads((fingerprint / 'local_n3_metrics.json').read_text(encoding='utf-8'))
          assert result['test_id'] == 'T-N3-004'
          assert result['evidence_class'] == 'PHYSICAL_LOCAL_N_DERIVATIVE_CAMB_FINGERPRINT'
          assert result['status'] in {
              'N3_SPECIFIC_CURVATURE_PRESENT',
              'LOCAL_N3_SCALAR_FINGERPRINT_PRESENT_NOT_UNIQUE',
              'NO_RESOLVABLE_LOCAL_N3_FINGERPRINT',
          }
          local = result['local_step']
          curvature = result['n3_specific_curvature']
          for value in (
              local['raw_cv_norm_ell30_3000'],
              local['projected_cv_norm_ell30_3000'],
              local['survival_fraction'],
              curvature['projected_cv_norm_ell30_3000'],
              result['lensing_companion']['projected_cv_norm_L30_2000'],
          ):
              assert math.isfinite(float(value))
          assert 0 <= float(local['survival_fraction']) <= 1.000001
          assert local['best_band']['ell_min'] >= 30
          assert result['retired_test']['test_id'] == 'T-N3-003'
          assert 'not a Planck, ACT or SPT detection significance' in result['claim_boundary']
          report = (fingerprint / 'REPORT.md').read_text(encoding='utf-8')
          assert 'not an observed significance' in report

          manifest = {
              'test_id': 'T-N3-004',
              'objective': 'Find the physical local scalar-family CMB fingerprint around n=3.',
              'models': ['EarlyQuintessence n=2.8', 'EarlyQuintessence n=3.0', 'EarlyQuintessence n=3.2'],
              'canonical_slice': {
                  'fde_zc': 0.0880,
                  'log10_zc': 3.81,
                  'theta_i': 2.89155,
                  'H0': 70.795,
              },
              'commit': os.environ['COMMIT_SHA'],
              'workflow_run_id': os.environ['WORKFLOW_RUN_ID'],
              'workflow_run_attempt': os.environ['WORKFLOW_RUN_ATTEMPT'],
              'state': 'COMPLETED_AND_CONTRACT_VALIDATED',
              'result_status': result['status'],
              'claim_boundary': result['claim_boundary'],
          }
          (root / 'RUN_MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')
          hashes = []
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'ALL_FILES.sha256':
                  hashes.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}")
          (root / 'ALL_FILES.sha256').write_text('\n'.join(hashes) + '\n', encoding='utf-8')
          print('VALIDATED_LOCAL_N3=' + json.dumps({
              'status': result['status'],
              'projected_cv_norm': local['projected_cv_norm_ell30_3000'],
              'survival_fraction': local['survival_fraction'],
              'best_band': local['best_band']['name'],
              'curvature_cv_norm': curvature['projected_cv_norm_ell30_3000'],
              'lensing_cv_norm': result['lensing_companion']['projected_cv_norm_L30_2000'],
          }, sort_keys=True))
          print('COMPLETION_CONTRACT_PASS')
          PY

      - name: Upload complete physical n3 package
        uses: actions/upload-artifact@v4
        with:
          name: peer-n3-physical-fingerprint-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/n3_local
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
