name: nexo-peer-superposition-paper
on:
  push:
    branches: [nexo-peer-superposition-paper-20260827]
jobs:
  battery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy scipy pandas pytest
      - name: Contract tests
        run: PYTHONPATH=. pytest -q tests/test_peer_superposition_battery.py
