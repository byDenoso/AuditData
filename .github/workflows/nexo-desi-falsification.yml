name: nexo-desi-falsification

on:
  push:
    branches: [nexo-desi-voidscan-temp-20260826]
    paths: [.github/workflows/nexo-desi-falsification.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip numpy scipy pandas astropy
      - name: Download DESI versions and eBOSS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/v15 data/v12 data/eboss battery
          B15='https://data.desi.lbl.gov/public/dr1/survey/catalogs/dr1/LSS/iron/LSScats/v1.5'
          B12='https://data.desi.lbl.gov/public/dr1/survey/catalogs/dr1/LSS/iron/LSScats/v1.2'
          for V in 15 12; do
            BVAR="B${V}"; B="${!BVAR}"
            curl -fL --retry 5 "$B/LRG_NGC_clustering.dat.fits" -o data/v${V}/LRG_NGC.fits
            curl -fL --retry 5 "$B/LRG_SGC_clustering.dat.fits" -o data/v${V}/LRG_SGC.fits
          done
          E='https://data.sdss.org/sas/dr16/eboss/lss/catalogs/DR16'
          curl -fL --retry 5 "$E/eBOSS_LRG_clustering_data-NGC-vDR16.fits" -o data/eboss/eBOSS_LRG_NGC.fits
          curl -fL --retry 5 "$E/eBOSS_LRG_clustering_data-SGC-vDR16.fits" -o data/eboss/eBOSS_LRG_SGC.fits
          curl -fL --retry 5 "$E/eBOSS_LRGpCMASS_clustering_data-NGC-vDR16.fits" -o data/eboss/eBOSS_LRGpCMASS_NGC.fits
          curl -fL --retry 5 "$E/eBOSS_LRGpCMASS_clustering_data-SGC-vDR16.fits" -o data/eboss/eBOSS_LRGpCMASS_SGC.fits
          curl -fL --retry 5 "$E/eBOSS_ELG_clustering_data-NGC-vDR16.fits" -o data/eboss/eBOSS_ELG_NGC.fits
          curl -fL --retry 5 "$E/eBOSS_ELG_clustering_data-SGC-vDR16.fits" -o data/eboss/eBOSS_ELG_SGC.fits
          curl -fL --retry 5 "$E/eBOSS_QSO_clustering_data-NGC-vDR16.fits" -o data/eboss/eBOSS_QSO_NGC.fits
          curl -fL --retry 5 "$E/eBOSS_QSO_clustering_data-SGC-vDR16.fits" -o data/eboss/eBOSS_QSO_SGC.fits
          du -sh data/*
      - name: Execute falsification battery
        run: |
          python tools/falsification_battery.py \
            --candidates tools/falsification_candidates.csv \
            --v15 data/v15 --v12 data/v12 --eboss data/eboss \
            --nulls 100 --outdir battery | tee battery/run.log
      - name: Readback
        run: |
          echo '=== SUMMARY ==='; cat battery/battery_summary.csv
          echo '=== EBOSS ==='; cat battery/eboss_independent.csv
          echo '=== VERSION ==='; cat battery/catalog_version.csv
          echo '=== V15 STABILITY ==='; cat battery/desi_v15_stability.csv
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-desi-falsification-local
          path: battery/
          if-no-files-found: error
          retention-days: 1

  ezmock-lookelsewhere:
    strategy:
      fail-fast: false
      matrix:
        mock: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip numpy scipy pandas astropy
      - name: Download EZmock LRG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mockdata mockout
          B="https://data.desi.lbl.gov/public/dr1/survey/catalogs/dr1/mocks/EZmock/dark/v1/mock${{ matrix.mock }}"
          curl -fL --retry 5 "$B/LRG_ffa_NGC_clustering.dat.fits" -o mockdata/LRG_NGC.fits
          curl -fL --retry 5 "$B/LRG_ffa_SGC_clustering.dat.fits" -o mockdata/LRG_SGC.fits
          ls -lh mockdata
      - name: Replay exact blind finder
        run: |
          python tools/desi_blind_scan.py \
            --lrg-ngc mockdata/LRG_NGC.fits --lrg-sgc mockdata/LRG_SGC.fits \
            --queries 50000 --mocks 5 --outdir mockout | tee mockout/run.log
      - name: Mock extremeness readback
        run: |
          python - <<'PY'
          import json, pandas as pd
          from pathlib import Path
          v=pd.read_csv('mockout/void_candidates.csv')
          w=pd.read_csv('mockout/wall_candidates.csv')
          thresholds={'V145':15.667543,'V14':21.494811,'V11':22.019039,'V102':16.802955}
          out={'mock':${{ matrix.mock }},'void_count':len(v),'wall_count':len(w),'max_void_score':float(v.score.max()) if len(v) else None,'max_wall_score':float(w.score.max()) if len(w) else None}
          for k,t in thresholds.items(): out['n_void_score_ge_'+k]=int((v.score>=t).sum()) if len(v) else 0
          out['n_wall_score_ge_W13']=int((w.score>=22.126411).sum()) if len(w) else 0
          Path('mockout/extremeness.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-ezmock-${{ matrix.mock }}
          path: mockout/
          if-no-files-found: error
          retention-days: 1
