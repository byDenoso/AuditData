name: DESI DR1 materialization gate

on:
  pull_request:
    branches: [desi-dr1-materialize-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official DESI hierarchy
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://data.desi.lbl.gov/public/dr1/vac/dr1/full-shape-bao-clustering'
          for suffix in \
            '' '/' \
            '/data' '/data/' '/data/likelihood' '/data/likelihood/' \
            '/v1.5' '/v1.5/' '/v1.5/data' '/v1.5/data/' '/v1.5/data/likelihood' '/v1.5/data/likelihood/' \
            '/data_v1.5' '/data_v1.5/' '/data_v1.5/likelihood' '/data_v1.5/likelihood/'; do
            url="${ROOT}${suffix}"
            code="$(curl --location --silent --show-error --connect-timeout 15 --max-time 60 -o /tmp/desi-body -w '%{http_code}' "$url" || true)"
            bytes="$(stat -c '%s' /tmp/desi-body 2>/dev/null || echo 0)"
            prefix="$(head -c 80 /tmp/desi-body 2>/dev/null | tr '\n' ' ' || true)"
            printf 'PROBE code=%s bytes=%s url=%s prefix=%q\n' "$code" "$bytes" "$url" "$prefix"
          done
