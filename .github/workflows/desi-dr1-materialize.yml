name: DESI DR1 materialization gate

on:
  pull_request:
    branches: [desi-dr1-materialize-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Enumerate official DESI release root
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://data.desi.lbl.gov/public/dr1/vac/dr1/full-shape-bao-clustering/'
          curl --fail --location --silent --show-error --connect-timeout 5 --max-time 20 "$ROOT" -o root.html
          echo "ROOT_BYTES=$(stat -c '%s' root.html)"
          python - <<'PY'
          import html, re
          text = open('root.html', encoding='utf-8', errors='replace').read()
          for href in re.findall(r'href=["\x27]([^"\x27]+)["\x27]', text, flags=re.I):
              print('HREF', html.unescape(href))
          PY
