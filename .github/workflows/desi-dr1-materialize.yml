name: DESI DR1 materialization gate

on:
  pull_request:
    branches: [desi-dr1-materialize-base]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe official DESI hierarchy
        shell: bash
        run: |
          set -euo pipefail
          ROOT='https://data.desi.lbl.gov/public/dr1/vac/dr1/full-shape-bao-clustering'
          for suffix in '' '/data' '/data/likelihood' '/v1.5' '/v1.5/data/likelihood' '/data_v1.5' '/data_v1.5/likelihood'; do
            url="${ROOT}${suffix}"
            line="$(curl --head --location --silent --show-error --connect-timeout 5 --max-time 8 -o /dev/null -w 'code=%{http_code} effective=%{url_effective}' "$url" || true)"
            printf 'PROBE %s url=%s\n' "$line" "$url"
          done
