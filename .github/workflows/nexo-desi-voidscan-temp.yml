name: nexo-desi-voidscan-temp

on:
  push:
    branches: [nexo-desi-voidscan-temp-20260826]
    paths: [.github/workflows/nexo-desi-voidscan-temp.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip numpy scipy pandas astropy
      - name: Download DESI and ASTRA controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data astra validation
          B='https://data.desi.lbl.gov/public/dr1/survey/catalogs/dr1/LSS/iron/LSScats/v1.5'
          curl -fL --retry 5 "$B/LRG_NGC_clustering.dat.fits" -o data/LRG_NGC.fits
          curl -fL --retry 5 "$B/LRG_SGC_clustering.dat.fits" -o data/LRG_SGC.fits
          curl -fL --retry 5 "$B/ELG_LOPnotqso_NGC_clustering.dat.fits" -o data/ELG_NGC.fits
          curl -fL --retry 5 "$B/ELG_LOPnotqso_SGC_clustering.dat.fits" -o data/ELG_SGC.fits
          curl -fL --retry 5 'https://zenodo.org/records/19687221/files/groups.tar.gz?download=1' -o astra/groups.tar.gz
          tar -xzf astra/groups.tar.gz -C astra
          echo 'ASTRA files:'; find astra -type f | head -30
      - name: Validate frozen candidates
        run: |
          python tools/validate_frozen_candidates.py \
            --lrg-ngc data/LRG_NGC.fits --lrg-sgc data/LRG_SGC.fits \
            --elg-ngc data/ELG_NGC.fits --elg-sgc data/ELG_SGC.fits \
            --candidates tools/frozen_candidates.csv --astra-root astra \
            --mocks 100 --outdir validation | tee validation/run.log
      - name: Readback
        run: |
          cat validation/validation_summary.json
          cat validation/frozen_validation.csv
      - uses: actions/upload-artifact@v4
        with:
          name: nexo-desi-frozen-validation
          path: validation/
          if-no-files-found: error
          retention-days: 1
