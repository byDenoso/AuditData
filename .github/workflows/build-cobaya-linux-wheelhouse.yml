name: Build Cobaya Linux wheelhouse

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-cobaya-linux-wheelhouse.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheelhouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Download pinned inference stack
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          mkdir -p wheelhouse
          cat > requirements-portable.txt <<'EOF'
          camb==1.6.6
          cobaya==3.6.2
          getdist==1.7.7
          mpi4py==4.1.1
          py-bobyqa==1.5.0
          syslibrary==0.2
          dill==0.4.1
          fgspectra==1.4.1
          portalocker
          packaging
          requests
          PyYAML
          tqdm
          EOF
          python -m pip download --dest wheelhouse -r requirements-portable.txt
          python -m pip install --no-index --find-links wheelhouse -r requirements-portable.txt
          python - <<'PY'
          import camb, cobaya, getdist
          print('CAMB', camb.__version__)
          print('Cobaya', cobaya.__version__)
          print('GetDist', getdist.__version__)
          assert camb.__version__ == '1.6.6'
          assert cobaya.__version__ == '3.6.2'
          PY
          sha256sum wheelhouse/* > wheelhouse/SHA256SUMS.txt
          python -m pip freeze > wheelhouse/PIP_FREEZE.txt

      - name: Upload wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: cobaya-linux-py313-wheelhouse
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 3
