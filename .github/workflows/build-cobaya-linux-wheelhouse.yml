name: Build Cobaya Linux wheelhouse

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/build-cobaya-linux-wheelhouse.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheelhouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download exact pinned inference stack
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          mkdir -p wheelhouse
          cat > requirements-linux-py313-pinned.txt <<'EOF'
          astropy==7.2.0
          camb==1.6.6
          cobaya==3.6.2
          contourpy==1.3.3
          dill==0.4.1
          fgspectra==1.4.1
          getdist==1.7.7
          matplotlib==3.10.9
          mpi4py==4.1.1
          mpmath==1.3.0
          numpy==2.4.4
          pandas==3.0.3
          py-bobyqa==1.5.0
          PyYAML==6.0.3
          scipy==1.17.1
          sympy==1.14.0
          syslibrary==0.2
          tqdm==4.67.3
          typing-extensions==4.15.0
          EOF
          python -m pip download --dest wheelhouse -r requirements-linux-py313-pinned.txt
          cp requirements-linux-py313-pinned.txt wheelhouse/REQUIREMENTS.txt
          python -m pip install --no-index --find-links wheelhouse -r requirements-linux-py313-pinned.txt
          python - <<'PY'
          import camb, cobaya, getdist, numpy, scipy, yaml
          expected = {
              'CAMB': (camb.__version__, '1.6.6'),
              'Cobaya': (cobaya.__version__, '3.6.2'),
              'GetDist': (getdist.__version__, '1.7.7'),
              'NumPy': (numpy.__version__, '2.4.4'),
              'SciPy': (scipy.__version__, '1.17.1'),
              'PyYAML': (yaml.__version__, '6.0.3'),
          }
          for name, (actual, target) in expected.items():
              print(name, actual)
              assert actual == target, (name, actual, target)
          PY
          sha256sum wheelhouse/* > wheelhouse/SHA256SUMS.txt
          python -m pip freeze > wheelhouse/PIP_FREEZE.txt

      - name: Upload exact wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: cobaya-linux-py313-wheelhouse-pinned
          path: wheelhouse/
          if-no-files-found: error
          retention-days: 3
