name: Materialize candl 3.0.0 20260902

on:
  push:
    paths:
      - '.github/workflows/materialize-candl300-20260902.yml'
  pull_request:
    paths:
      - '.github/candl300-materialize-trigger-20260902.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Build pinned candl wheelhouse
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel
          mkdir wheels
          python -m pip wheel --wheel-dir wheels 'candl-like==3.0.0'
          sha256sum wheels/* | sort > wheels/SHA256SUMS.txt
          python -m venv smoke
          smoke/bin/pip install --no-index --find-links wheels 'candl-like==3.0.0'
          smoke/bin/python - <<'PY'
          import candl
          print('candl_version=', getattr(candl, '__version__', 'unknown'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candl300-wheelhouse-py312
          path: wheels
          compression-level: 0
          retention-days: 3
