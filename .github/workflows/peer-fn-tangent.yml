name: PEER f-n tangent-basis robustness

on:
  pull_request:
    branches: [main]
    paths:
      - 'fn_tangent/**'
      - '.github/workflows/peer-fn-tangent.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  PYTHONPATH: ${{ github.workspace }}
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'

jobs:
  tangent:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {anchor: "null", f: "0.0", n: "3.0"}
          - {anchor: "best", f: "0.06", n: "3.0"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pinned CAMB runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel
          python -m pip install 'numpy==2.1.3' 'scipy==1.14.1' 'camb==1.6.6'
      - name: Generate exact tangent basis
        run: |
          set -euo pipefail
          mkdir -p results/${{ matrix.anchor }}
          timeout --signal=INT --kill-after=60s 135m \
            python -m fn_tangent.generate \
              --output results/${{ matrix.anchor }} \
              --anchor-name "${{ matrix.anchor }}" \
              --f-peer "${{ matrix.f }}" \
              --n "${{ matrix.n }}" \
              --lmax 3000 \
            |& tee results/${{ matrix.anchor }}/generation.log
      - name: Validate tangent contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          root = Path('results/${{ matrix.anchor }}')
          npz = sorted(root.glob('deriv_*.npz'))
          meta = sorted(root.glob('deriv_*.json'))
          assert len(npz) == 14, len(npz)
          assert len(meta) == 14, len(meta)
          for path in npz:
              with np.load(path) as payload:
                  assert np.array_equal(payload['ell'], np.arange(3001))
                  assert payload['lensed'].shape[0] == 3001
                  assert np.all(np.isfinite(payload['lensed']))
          contract = json.loads((root/'generation_contract.json').read_text())
          assert contract['state'] == 'TANGENT_BASIS_COMPLETED_AND_VALIDATED'
          assert contract['derivative_spectra'] == 14
          print('TANGENT_CONTRACT_PASS', contract['anchor_name'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: peer-fn-tangent-${{ matrix.anchor }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/${{ matrix.anchor }}
          if-no-files-found: error
          retention-days: 7

  package:
    needs: tangent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: peer-fn-tangent-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/tangents
      - name: Validate robustness package
        env:
          COMMIT_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('results/tangents')
          anchors = sorted(path for path in root.iterdir() if path.is_dir())
          assert len(anchors) == 2, anchors
          for anchor in anchors:
              assert len(list(anchor.glob('deriv_*.npz'))) == 14
              assert len(list(anchor.glob('deriv_*.json'))) == 14
          manifest = {
              'test_id': 'T-FN-001-TANGENT',
              'state': 'TWO_TANGENT_BASES_COMPLETED_AND_VALIDATED',
              'commit': os.environ['COMMIT_SHA'],
              'workflow_run_id': os.environ['WORKFLOW_RUN_ID'],
              'anchors': [path.name for path in anchors],
              'spectra_count': 28,
          }
          (root/'TANGENT_MANIFEST.json').write_text(json.dumps(manifest, indent=2, sort_keys=True))
          hashes=[]
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'ALL_FILES.sha256':
                  hashes.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}")
          (root/'ALL_FILES.sha256').write_text('\n'.join(hashes)+'\n')
          print('TANGENT_PACKAGE_PASS', json.dumps(manifest, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: peer-fn-tangent-bases-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/tangents
          if-no-files-found: error
          retention-days: 30
