name: nexo-peer-h0-paper-battery
on:
  push:
    branches: [nexo-desi-voidscan-temp-20260826]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy scipy pandas pytest
      - name: RED contract tests
        run: PYTHONPATH=. pytest -q tests/test_peer_h0_paper_battery.py
