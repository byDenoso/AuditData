name: Build PEER Linux Wheels

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/peer-wheel-trigger.txt'
  pull_request:
    paths:
      - '.github/peer-wheel-pr-trigger.txt'

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  build-wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Materialize Linux wheels
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          mkdir -p wheels
          python -m pip download --dest wheels --only-binary=:all: camb==1.6.6 cobaya==3.6.2
          python -m pip download --dest wheels numpy scipy pyyaml pandas getdist mpi4py dill tqdm packaging typing-extensions
          sha256sum wheels/* | tee wheels/SHA256SUMS.txt
      - name: Upload wheelhouse
        uses: actions/upload-artifact@v4
        with:
          name: peer-linux-wheelhouse-py313
          path: wheels
          if-no-files-found: error
          retention-days: 1
