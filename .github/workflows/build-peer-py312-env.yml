name: Build PEER Python 3.12 Environment

on:
  push:
    paths:
      - '.github/workflows/build-peer-py312-env.yml'
      - 'peer-env-trigger.txt'
  pull_request:
    paths:
      - '.github/workflows/build-peer-py312-env.yml'
      - 'peer-env-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.17'
      - name: Build relocatable Python 3.12 environment
        shell: bash
        run: |
          set -euxo pipefail
          uv python install 3.12
          uv venv --python 3.12 --relocatable peer-py312
          uv pip install --python peer-py312/bin/python \
            astropy==7.2.0 \
            camb==1.6.6 \
            cobaya==3.6.2 \
            contourpy==1.3.3 \
            dill==0.4.1 \
            dynesty==2.1.5 \
            fgspectra==1.4.1 \
            getdist==1.7.7 \
            h5py==3.14.0 \
            joblib==1.5.1 \
            matplotlib==3.10.9 \
            mpmath==1.3.0 \
            numpy==2.4.4 \
            pandas==3.0.3 \
            py-bobyqa==1.5.0 \
            pytest==8.4.2 \
            pyyaml==6.0.3 \
            scipy==1.17.1 \
            statsmodels==0.14.5 \
            sympy==1.14.0 \
            syslibrary==0.2 \
            tqdm==4.67.3 \
            typing-extensions==4.15.0
          peer-py312/bin/python - <<'PY'
          import sys, camb, cobaya, dynesty, numpy, scipy, pybobyqa
          print(sys.version)
          print('camb', camb.__version__)
          print('cobaya', cobaya.__version__)
          print('dynesty', dynesty.__version__)
          print('numpy', numpy.__version__)
          print('scipy', scipy.__version__)
          print('pybobyqa', pybobyqa.__version__)
          PY
          tar --zstd -cf peer-py312-env.tar.zst peer-py312
          sha256sum peer-py312-env.tar.zst > peer-py312-env.tar.zst.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: peer-py312-env
          path: |
            peer-py312-env.tar.zst
            peer-py312-env.tar.zst.sha256
          retention-days: 7
          compression-level: 0
