name: nexo-local-joint-control-test
on:
  push:
    branches: [nexo-desi-voidscan-temp-20260826]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip numpy scipy pandas pytest
      - name: Joint-control contract
        run: PYTHONPATH=. pytest -q tests/test_local_joint_control.py
