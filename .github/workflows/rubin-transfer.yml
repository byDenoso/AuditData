name: Rubin public-data transfer bridge

on:
  push:
    paths:
      - 'rubin-transfer/config.json'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-slim
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          include=[]
          for i in range(12):
              include.append({"kind":"x05","index":i,"name":f"x05-{i:03d}"})
          for i in range(125):
              include.append({"kind":"raw","index":i,"name":f"raw-{i:03d}"})
          print("matrix="+json.dumps({"include":include},separators=(",",":")))
          PY

  transfer:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Prepare workspace
        run: mkdir -p payload

      - name: Download Rubin payload
        env:
          KIND: ${{ matrix.kind }}
          INDEX: ${{ matrix.index }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$KIND" = "x05" ]; then
            URL='https://storage.googleapis.com/asteroid-institute-public/production/rubin/mpc/obs_sbn/full/parquet/obs_sbn_X05_full.parquet'
            TOTAL=1033995336
            CHUNK=90000000
            START=$(( INDEX * CHUNK ))
            if [ "$START" -ge "$TOTAL" ]; then echo "invalid part" >&2; exit 2; fi
            END=$(( START + CHUNK - 1 ))
            if [ "$END" -ge "$TOTAL" ]; then END=$(( TOTAL - 1 )); fi
            EXPECTED=$(( END - START + 1 ))
            NAME=$(printf 'obs_sbn_X05_full.parquet.part-%03d-of-012' "$INDEX")
            curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors --range "${START}-${END}" "$URL" -o "payload/$NAME"
            ACTUAL=$(stat -c%s "payload/$NAME")
            [ "$ACTUAL" -eq "$EXPECTED" ]
            SHA=$(sha256sum "payload/$NAME" | awk '{print $1}')
            EDGE='N/A'
            if [ "$INDEX" -eq 0 ]; then
              [ "$(head -c 4 "payload/$NAME")" = 'PAR1' ]
              EDGE='HEAD_PAR1_PASS'
            fi
            if [ "$INDEX" -eq 11 ]; then
              [ "$(tail -c 4 "payload/$NAME")" = 'PAR1' ]
              EDGE='TAIL_PAR1_PASS'
            fi
            jq -n               --arg dataset_id 'RUBIN_MPC_X05_FULL_PARQUET'               --arg class 'REAL_WORLD_PUBLIC'               --arg source_url "$URL"               --arg file "$NAME"               --arg sha256 "$SHA"               --arg edge "$EDGE"               --argjson part_index "$INDEX"               --argjson part_count 12               --argjson source_total_bytes "$TOTAL"               --argjson start_byte "$START"               --argjson end_byte "$END"               --argjson bytes "$ACTUAL"               '{schema_version:1,dataset_id:$dataset_id,class:$class,source_url:$source_url,file:$file,bytes:$bytes,sha256:$sha256,part_index:$part_index,part_count:$part_count,source_total_bytes:$source_total_bytes,start_byte:$start_byte,end_byte:$end_byte,edge_validation:$edge}'               > payload/TRANSFER_RECEIPT.json
          else
            SCRIPT_URL='https://irsa.ipac.caltech.edu/data/theory/openuniverse2024/bulk-download-scripts/rubin-LSSTCam-raw-all-raw-2025.sh'
            curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "$SCRIPT_URL" -o listing.sh
            grep -oE "https://[^']+" listing.sh > urls.txt
            START=$(( INDEX * 4 + 1 ))
            END=$(( START + 3 ))
            sed -n "${START},${END}p" urls.txt > selected.txt
            [ "$(wc -l < selected.txt)" -eq 4 ]
            : > files.jsonl
            while IFS= read -r URL; do
              NAME=$(basename "$URL")
              curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors "$URL" -o "payload/$NAME"
              BYTES=$(stat -c%s "payload/$NAME")
              SHA=$(sha256sum "payload/$NAME" | awk '{print $1}')
              MAGIC=$(head -c 6 "payload/$NAME" | tr -d '\000')
              case "$MAGIC" in
                SIMPLE*) ;;
                *) echo "FITS header check failed for $NAME: $MAGIC" >&2; exit 22 ;;
              esac
              jq -n --arg name "$NAME" --arg source_url "$URL" --arg sha256 "$SHA" --argjson bytes "$BYTES"                 '{name:$name,source_url:$source_url,bytes:$bytes,sha256:$sha256,class:"PUBLIC_SIMULATED_RUBIN_RAW",fits_header:"PASS"}' >> files.jsonl
            done < selected.txt
            jq -s               --arg dataset_id 'OPENUNIVERSE2024_RUBIN_RAW_2025_SAMPLE'               --arg listing_url "$SCRIPT_URL"               --argjson batch_index "$INDEX"               '{schema_version:1,dataset_id:$dataset_id,class:"PUBLIC_SIMULATED_RUBIN",listing_url:$listing_url,batch_index:$batch_index,selection:"4 consecutive URLs from official 2025 Rubin raw bulk script",files:.,total_bytes:(map(.bytes)|add)}'               files.jsonl > payload/TRANSFER_RECEIPT.json
          fi
          sha256sum payload/* > payload/SHA256SUMS.txt
          du -sb payload

      - name: Upload transient transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubin-small-${{ matrix.name }}
          path: payload/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
